<!-- BACKUP VARIANT — not wired up. To use it, copy over app/icon.svg and
     regenerate the apple PNG from a square-cornered copy (npm run gen-icons).

     Ledger Paper ground (#EDE8DE) with the Ember mark in its light-surface
     shade #C2410C, not #F26419: the bright shade only clears 3.2:1 on white,
     so on a pale ground the mark washes out. The two secondary bars flip to
     ink (#131C26) for the same reason. -->
<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="รายจ่ายรายวัน">
  <defs>
    <pattern id="grid" width="2" height="2" patternUnits="userSpaceOnUse">
      <path d="M2 0V2M0 2H2" stroke="#131C26" stroke-opacity=".10" stroke-width=".14"/>
    </pattern>
  </defs>
  <rect width="24" height="24" rx="5.4" fill="#EDE8DE"/>
  <rect width="24" height="24" rx="5.4" fill="url(#grid)"/>
  <g transform="translate(12 12) scale(.74) translate(-12 -12)">
    <rect x="2"  y="14" width="4" height="8"  rx="2" fill="#131C26" fill-opacity=".28"/>
    <rect x="10" y="9"  width="4" height="13" rx="2" fill="#131C26" fill-opacity=".55"/>
    <path d="M18 6 L22 2 L22 20 A2 2 0 0 1 18 20 Z" fill="#C2410C"/>
  </g>
</svg>
